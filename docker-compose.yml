# Producción en el VPS: API + Postgres + Cloudflare Tunnel.
# - Ningún puerto abierto a internet: `tunnel` sale hacia Cloudflare y le entrega
#   el tráfico de https://<hostname> a la API por la red interna de Docker.
# - Postgres no publica puertos. La API solo en 127.0.0.1 (para depurar desde el host).
#   (Docker se salta UFW: nunca publicar en 0.0.0.0.)
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
    ports:
      - "127.0.0.1:${API_PORT:-3100}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Túnel creado con `cloudflared tunnel create`. `./cloudflared/` (fuera de git) contiene:
  #   config.yml        → tunnel, credentials-file e ingress hacia http://api:3000
  #   credentials.json  → credenciales del túnel (secreto)
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - api

volumes:
  pgdata:
